<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ömer & Ela Nikah Töreni</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ffe6f0 0%, #e6f2ff 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: white;
            min-height: 100vh;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        @media (min-width: 481px) {
            .container {
                min-height: 850px;
                border-radius: 20px;
            }
        }

        /* Şifre Ekranı */
        #lock-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.95);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
        }

        .lock-card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 350px;
        }

        .lock-card h2 {
            margin-bottom: 15px;
            color: #d81b60;
        }

        .lock-card p {
            margin-bottom: 20px;
            font-size: 14px;
            color: #666;
        }

        .lock-card input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            text-align: center;
            margin-bottom: 15px;
            outline: none;
            transition: border-color 0.3s;
        }

        .lock-card input:focus {
            border-color: #d81b60;
        }

        .lock-card button {
            width: 100%;
            padding: 12px;
            background: #d81b60;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        .lock-card button:hover {
            background: #ad1457;
        }

        .error-msg {
            color: #e53935;
            font-size: 13px;
            margin-top: 10px;
            display: none;
        }

        /* Üst Panel / Header */
        .header {
            background: white;
            margin: 15px;
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-info h1 {
            font-size: 15px;
            color: #222;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .header-info p {
            font-size: 11px;
            color: #666;
            margin-top: 3px;
        }

        .btn-start {
            background: #f8bbd0;
            color: #880e4f;
            border: none;
            padding: 10px 15px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: background 0.2s;
        }

        .btn-start:hover {
            background: #f48fb1;
        }

        /* Sahne Alanı */
        .stage-container {
            flex: 1;
            margin: 0 15px 15px 15px;
            background: #e0f2f1;
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            border: 2px solid #b2dfdb;
        }

        /* Nikah Masası ve Sahne Düzeni */
        .stage-floor {
            height: 140px;
            width: 100%;
            background: #80cbc4;
            position: relative;
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            padding-bottom: 10px;
        }

        /* Nikah Masası */
        .table-area {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }

        .wedding-table {
            width: 130px;
            height: 25px;
            background: #5d4037;
            border-radius: 4px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        .table-legs {
            display: flex;
            justify-content: space-between;
            width: 110px;
            height: 20px;
        }

        .table-legs div {
            width: 8px;
            height: 20px;
            background: #3e2723;
        }

        .marriage-book {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            width: 30px;
            height: 18px;
            background: #b71c1c;
            border-radius: 2px;
            border: 1px solid #ffccbc;
            z-index: 11;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 8px;
            color: white;
            font-weight: bold;
        }

        /* Karakterler */
        .characters-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            width: 100%;
            padding: 0 10px;
            position: absolute;
            bottom: 10px;
            z-index: 5;
        }

        .character-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 48px;
        }

        .stickman {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .head {
            width: 20px;
            height: 20px;
            border: 2px solid #333;
            border-radius: 50%;
            background: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .body-line {
            width: 2px;
            height: 32px;
            background: #333;
        }

        .arms {
            position: absolute;
            top: 24px;
            width: 30px;
            height: 2px;
            background: #333;
        }

        .legs {
            width: 18px;
            height: 20px;
            display: flex;
            justify-content: space-between;
        }

        .leg {
            width: 2px;
            height: 20px;
            background: #333;
        }

        .name-tag {
            font-size: 9px;
            font-weight: bold;
            color: #111;
            margin-top: 4px;
            background: rgba(255,255,255,0.85);
            padding: 1px 4px;
            border-radius: 4px;
            white-space: nowrap;
        }

        /* Konuşma Balonu */
        .speech-bubble {
            position: absolute;
            top: -45px;
            background: white;
            border: 2px solid #333;
            padding: 4px 8px;
            border-radius: 10px;
            font-size: 10px;
            font-weight: bold;
            white-space: nowrap;
            box-shadow: 0 3px 6px rgba(0,0,0,0.15);
            z-index: 30;
            display: none;
        }

        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 6px 6px 0;
            border-style: solid;
            border-color: #333 transparent;
            display: block;
            width: 0;
        }

        /* Seyirciler Bölümü (Arka Kalabalık) */
        .audience-area {
            position: absolute;
            top: 10px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 6px;
            z-index: 4;
            padding: 0 10px;
            flex-wrap: wrap;
        }

        .audience-member {
            display: flex;
            flex-direction: column;
            align-items: center;
            transform: scale(0.65);
            opacity: 0.85;
        }

        /* Konfeti Efekti */
        .confetti {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #ff4081;
            animation: fall 2s linear infinite;
            z-index: 50;
            display: none;
        }

        @keyframes fall {
            0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(300px) rotate(360deg); opacity: 0; }
        }

        /* Durum Metni */
        .status-bar {
            text-align: center;
            padding: 8px;
            font-size: 12px;
            font-weight: bold;
            color: #00796b;
            background: #b2dfdb;
            border-radius: 8px;
            margin: 0 15px 15px 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Şifre Giriş Ekranı -->
        <div id="lock-screen">
            <div class="lock-card">
                <h2>💍 Ömer & Ela Nikahı</h2>
                <p>Törene katılmak için lütfen şifreyi girin:</p>
                <input type="password" id="pass-input" placeholder="Şifre (omerela2026)">
                <button onclick="checkPassword()">Törene Giriş Yap</button>
                <div id="error-msg" class="error-msg">Yanlış şifre! Tekrar dene.</div>
            </div>
        </div>

        <!-- Üst Başlık Bilgisi -->
        <div class="header">
            <div class="header-info">
                <h1>👰 Ömer & Ela Nikahı 🤵</h1>
                <p>Memur: Yaren | Şahitler: Buğra & Ecrin</p>
            </div>
            <button class="btn-start" onclick="startCeremony()">
                ▶ Başlat
            </button>
        </div>

        <!-- Sahne -->
        <div class="stage-container" id="stage">
            <!-- İzleyiciler (Kalabalık Arka Sıra - İsimsiz) -->
            <div class="audience-area">
                <div class="audience-member"><div class="stickman"><div class="head"></div><div class="arms"></div><div class="body-line" style="background:#3f51b5;"></div><div class="legs"><div class="leg"></div><div class="leg"></div></div></div></div>
                <div class="audience-member"><div class="stickman"><div class="head"></div><div class="arms"></div><div class="body-line" style="background:#e91e63;"></div><div class="legs"><div class="leg"></div><div class="leg"></div></div></div></div>
                <div class="audience-member"><div class="stickman"><div class="head"></div><div class="arms"></div><div class="body-line" style="background:#00bcd4;"></div><div class="legs"><div class="leg"></div><div class="leg"></div></div></div></div>
                <div class="audience-member"><div class="stickman"><div class="head"></div><div class="arms"></div><div class="body-line" style="background:#8bc34a;"></div><div class="legs"><div class="leg"></div><div class="leg"></div></div></div></div>
                <div class="audience-member"><div class="stickman"><div class="head"></div><div class="arms"></div><div class="body-line" style="background:#ff9800;"></div><div class="legs"><div class="leg"></div><div class="leg"></div></div></div></div>
                <div class="audience-member"><div class="stickman"><div class="head"></div><div class="arms"></div><div class="body-line" style="background:#9c27b0;"></div><div class="legs"><div class="leg"></div><div class="leg"></div></div></div></div>
                <div class="audience-member"><div class="stickman"><div class="head"></div><div class="arms"></div><div class="body-line" style="background:#009688;"></div><div class="legs"><div class="leg"></div><div class="leg"></div></div></div></div>
                <div class="audience-member"><div class="stickman"><div class="head"></div><div class="arms"></div><div class="body-line" style="background:#795548;"></div><div class="legs"><div class="leg"></div><div class="leg"></div></div></div></div>
                <div class="audience-member"><div class="stickman"><div class="head"></div><div class="arms"></div><div class="body-line" style="background:#607d8b;"></div><div class="legs"><div class="leg"></div><div class="leg"></div></div></div></div>
                <div class="audience-member"><div class="stickman"><div class="head"></div><div class="arms"></div><div class="body-line" style="background:#ff5722;"></div><div class="legs"><div class="leg"></div><div class="leg"></div></div></div></div>
            </div>

            <!-- Nikah Masası ve Defter -->
            <div class="table-area">
                <div class="marriage-book">DEFTER</div>
                <div class="wedding-table"></div>
                <div class="table-legs">
                    <div></div>
                    <div></div>
                </div>
            </div>

            <!-- Sahne Zemin ve Karakterler -->
            <div class="stage-floor">
                <!-- Şahit 1: Buğra -->
                <div class="character-group">
                    <div class="stickman">
                        <div class="head"></div>
                        <div class="arms"></div>
                        <div class="body-line" style="background:#1976d2;"></div>
                        <div class="legs"><div class="leg"></div><div class="leg"></div></div>
                    </div>
                    <span class="name-tag">Buğra</span>
                </div>

                <!-- Damat: Ömer -->
                <div class="character-group">
                    <div class="stickman">
                        <div class="head"></div>
                        <div class="arms"></div>
                        <div class="body-line" style="background:#212121;"></div>
                        <div class="legs"><div class="leg"></div><div class="leg"></div></div>
                        <div class="speech-bubble" id="omer-bubble">Evet!</div>
                    </div>
                    <span class="name-tag">Ömer</span>
                </div>

                <!-- Nikah Memuru: Yaren -->
                <div class="character-group">
                    <div class="stickman">
                        <div class="head"></div>
                        <div class="arms"></div>
                        <div class="body-line" style="background:#c2185b;"></div>
                        <div class="legs"><div class="leg"></div><div class="leg"></div></div>
                        <div class="speech-bubble" id="yaren-bubble">Kabul ediyor musunuz?</div>
                    </div>
                    <span class="name-tag">Yaren</span>
                </div>

                <!-- Gelin: Ela -->
                <div class="character-group">
                    <div class="stickman">
                        <div class="head" style="background:#fff8e1; border-color:#ffb300;"></div>
                        <div class="arms"></div>
                        <div class="body-line" style="background:#ffffff; border:1px solid #ddd;"></div>
                        <div class="legs"><div class="leg"></div><div class="leg"></div></div>
                        <div class="speech-bubble" id="ela-bubble">Bin kere evet! 💍</div>
                    </div>
                    <span class="name-tag">Ela</span>
                </div>

                <!-- Şahit 2: Ecrin -->
                <div class="character-group">
                    <div class="stickman">
                        <div class="head"></div>
                        <div class="arms"></div>
                        <div class="body-line" style="background:#7b1fa2;"></div>
                        <div class="legs"><div class="leg"></div><div class="leg"></div></div>
                    </div>
                    <span class="name-tag">Ecrin</span>
                </div>
            </div>
        </div>

        <!-- Durum Çubuğu -->
        <div class="status-bar" id="status-bar">
            Töreni başlatmak için sağ üstteki butona tıklayın!
        </div>
    </div>

    <script>
        function checkPassword() {
            const passInput = document.getElementById('pass-input').value;
            const errorMsg = document.getElementById('error-msg');
            
            if (passInput === 'omerela2026') {
                document.getElementById('lock-screen').style.display = 'none';
            } else {
                errorMsg.style.display = 'block';
            }
        }

        document.getElementById('pass-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                checkPassword();
            }
        });

        function startCeremony() {
            const yarenBubble = document.getElementById('yaren-bubble');
            const omerBubble = document.getElementById('omer-bubble');
            const elaBubble = document.getElementById('ela-bubble');
            const statusBar = document.getElementById('status-bar');

            yarenBubble.style.display = 'block';
            yarenBubble.innerText = "Ömer, Ela'yı eş olarak kabul ediyor musun?";
            statusBar.innerText = "Nikah Memuru Yaren soruyu sordu...";

            setTimeout(() => {
                yarenBubble.style.display = 'none';
                omerBubble.style.display = 'block';
                omerBubble.innerText = "SONSUZA KADAR EVET! 🤵";
                statusBar.innerText = "Damadımız Ömer coşkuyla evet dedi!";
            }, 3000);

            setTimeout(() => {
                omerBubble.style.display = 'none';
                yarenBubble.style.display = 'block';
                yarenBubble.innerText = "Ya sen Ela, kabul ediyor musun?";
                statusBar.innerText = "Sıra güzel gelinimizde...";
            }, 6000);

            setTimeout(() => {
                yarenBubble.style.display = 'none';
                elaBubble.style.display = 'block';
                elaBubble.innerText = "BİN KERE EVET! 💍👰";
                statusBar.innerText = "Gelinimiz Ela 'Bin Kere Evet' dedi!";
            }, 9000);

            setTimeout(() => {
                elaBubble.style.display = 'none';
                statusBar.innerText = "🎉 Kalabalık davetliler ve şahitler alkışlıyor! Nikah kıyıldı!";
                createConfetti();
            }, 12000);
        }

        function createConfetti() {
            const stage = document.getElementById('stage');
            for (let i = 0; i < 40; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti');
                confetti.style.left = Math.random() * stage.offsetWidth + 'px';
                confetti.style.top = -10 + 'px';
                confetti.style.backgroundColor = ['#ff4081', '#ffeb3b', '#00e676', '#7c4dff', '#00bcd4'][Math.floor(Math.random() * 5)];
                confetti.style.animationDuration = (1.5 + Math.random() * 2) + 's';
                confetti.style.display = 'block';
                stage.appendChild(confetti);

                setTimeout(() => {
                    confetti.remove();
                }, 3500);
            }
        }
    </script>
</body>
</html>
